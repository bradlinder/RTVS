name: Build & Release Installers

on:
  push:
    tags:
      - 'v*' # Automatically triggers and creates a Release when pushing a version tag (e.g. v1.5)
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows Installer (.exe)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS Disk Image (.dmg)'
        type: boolean
        default: false
      build_linux:
        description: 'Build Linux Tarball (.tar.gz)'
        type: boolean
        default: false
      create_release:
        description: 'Publish as a GitHub Release'
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g., v1.5 - optional, defaults to tag or timestamp)'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # WINDOWS BUILD
  # =========================================================================
  build-windows:
    name: Build Windows
    if: github.event_name == 'push' || inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup FFmpeg (Fast)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --prefer-binary -r requirements.txt -r requirements-build.txt

      - name: Run PyInstaller build
        run: python build_installer.py

      - name: Compile Inno Setup Installer
        run: iscc installer\Windows\RadioTVStorySegmenter.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioTVSegmenter-Windows
          path: dist/installer/*.exe
          retention-days: 3
          if-no-files-found: error

  # =========================================================================
  # MACOS BUILD
  # =========================================================================
  build-macos:
    name: Build macOS
    if: github.event_name == 'push' || inputs.build_macos
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup FFmpeg (Static macOS Binaries)
        run: |
          ARCH=$(uname -m)
          echo "Setting up FFmpeg for macOS ($ARCH)..."
          mkdir -p "$HOME/bin" bin
          
          if [ "$ARCH" = "arm64" ]; then
            FFMPEG_URL="https://github.com/Tyrrrz/FFmpegBin/releases/download/7.0.2/ffmpeg-osx-arm64.zip"
          else
            FFMPEG_URL="https://github.com/Tyrrrz/FFmpegBin/releases/download/7.0.2/ffmpeg-osx-x64.zip"
          fi
          
          echo "Downloading static FFmpeg from $FFMPEG_URL..."
          if curl -fsSL "$FFMPEG_URL" -o /tmp/ffmpeg.zip && unzip -q -o /tmp/ffmpeg.zip -d "$HOME/bin"; then
            rm -f /tmp/ffmpeg.zip
            chmod +x "$HOME/bin/ffmpeg" "$HOME/bin/ffprobe"
            cp "$HOME/bin/ffmpeg" bin/ 2>/dev/null || true
            cp "$HOME/bin/ffprobe" bin/ 2>/dev/null || true
            echo "$HOME/bin" >> $GITHUB_PATH
            export PATH="$HOME/bin:$PATH"
          fi
          
          # Fallback to Homebrew if static binaries are not functional
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo "Falling back to Homebrew for FFmpeg..."
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
            mkdir -p bin
            cp "$(which ffmpeg)" bin/ 2>/dev/null || true
            cp "$(which ffprobe)" bin/ 2>/dev/null || true
          fi

      - name: Verify FFmpeg Tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt -r requirements-build.txt

      - name: Run PyInstaller build
        run: python3 build_installer.py

      - name: Package .app into .dmg
        run: bash installer/macOS/build_app.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioTVSegmenter-macOS
          path: dist/*.dmg
          retention-days: 3
          if-no-files-found: error

  # =========================================================================
  # LINUX BUILD
  # =========================================================================
  build-linux:
    name: Build Linux
    if: github.event_name == 'push' || inputs.build_linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libxcb-cursor0 libpulse0

      - name: Install Python dependencies (CPU-only PyTorch)
        run: |
          python3 -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --prefer-binary -r requirements.txt -r requirements-build.txt

      - name: Run PyInstaller build
        run: python3 build_installer.py

      - name: Create tarball
        run: |
          cd dist
          tar -czvf RadioTVSegmenter-Linux-x86_64.tar.gz RadioTVSegmenter/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioTVSegmenter-Linux
          path: dist/RadioTVSegmenter-Linux-x86_64.tar.gz
          retention-days: 3
          if-no-files-found: error

  # =========================================================================
  # PUBLISH GITHUB RELEASE
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: always() && !cancelled() && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.5-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Radio & TV Segmenter ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_assets/*
